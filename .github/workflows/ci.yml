name: CI

# main への push は deploy.yml が同じ gate を実行するので、ここでは扱わない。
# 両方で走らせると同一 commit で lint / typecheck / test / build が二重になる。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # `prepare` runs `vp hooks enable`, which sets `core.hooksPath` for a
        # checkout that will never commit. Skipping it keeps a git-config write
        # out of the critical path of every run.
        env:
          VP_GIT_HOOKS: "0"
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
